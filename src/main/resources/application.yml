# Quarkus Configuration
quarkus:
  http:
    port: 8881
    cors:
      enabled: true
      origins: "*"
  application:
    name: rentlix-api

  # Database Configuration
  datasource:
    db-kind: postgresql
    username: ${APP_DATABASE_USERNAME:postgres}
    password: ${APP_DATABASE_PASSWORD:}
    jdbc:
      url: jdbc:postgresql://localhost:5432/rentlix

  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # Flyway Configuration
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration

  # Swagger Configuration
  swagger-ui:
    title: Rentlix API Documentation
    info-title: Rentlix API Documentation
    info-version: 1.0.0
    theme: muted
    try-it-out-enabled: true
    persist-authorization: true
    always-include: true
    path: /swagger-ui

  rest-client:
    via-cep:
      url: ${APP_VIACEP_URL:https://viacep.com.br}
      connect-timeout: ${APP_VIACEP_TIMEOUT_MS:10000}
      read-timeout: ${APP_VIACEP_TIMEOUT_MS:10000}

mp:
  jwt:
    verify:
      issuer: ${JWT_ISSUER:rentlix}
      publickey:
        location: ${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}

smallrye:
  jwt:
    sign:
      key:
        location: ${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}

# Application Configuration
app:
  server:
    timezone: ${SERVER_TIMEZONE:America/Sao_Paulo}
  auth:
    token-expiration-hours: ${AUTH_TOKEN_EXPIRATION_HOURS:8}
  email:
    verification-token-expires-minutes: ${EMAIL_VERIFICATION_TOKEN_EXPIRES_MINUTES:20}